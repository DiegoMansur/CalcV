<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale:1.0">
<title>Control de Anemometría</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f5f7">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background:#e9ecef;
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* ===== HEADER ===== */
.app-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.logo{
    font-size:18px;
    font-weight:600;
}

.history-btn{
    background:none;
    border:none;
    cursor:pointer;
}

.history-btn svg{
    width:22px;
    height:22px;
}

/* ===== CONTENEDOR ===== */
.container{
    flex:1;
    width:100%;
    max-width:460px;
    margin:20px auto;
    padding:0 15px 30px 15px;
}

/* ===== TARJETAS ===== */
.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

h2{
    text-align:center;
    margin-bottom:15px;
    font-size:17px;
}

/* ===== TABLAS ===== */
table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    table-layout:fixed;
}

th, td{
    border:1px solid #dcdcdc;
    padding:4px;
    text-align:center;
    word-wrap:break-word;
}

th{
    background:#f4f4f4;
    font-weight:600;
}

/* ===== INPUTS ===== */
input{
    width:100%;
    height:32px;
    padding:0 6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
    text-align:center;
    background:white;

    -webkit-appearance:none;
    appearance:none;
}

/* ===== BOTÓN ===== */
button{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    background:#1a73e8;
    color:white;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    opacity:0.9;
}

button:active{
    transform:scale(0.98);
}

/* ===== RESULTADOS (para que no se deformen) ===== */
#vprom, #sigma, #cv, 
#area, #q,
#bc1, #bc2, #bc3,
#c1, #c2, #c3{
    font-weight:500;
}

/* ===== ANIMACIONES ===== */

.fade-in{
    animation: fadeIn 0.4s ease forwards;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.slide-in{
    animation: slideIn 0.35s ease forwards;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(15px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

input[type="date"],
input[type="time"] {
    width: 100%;
    max-width: 100%;
    font-size: 16px;
    box-sizing: border-box;
}

input[type="date"],
input[type="time"] {
    appearance: none;
    -webkit-appearance: none;
    height: 34px;
    padding: 4px;
}

td {
    overflow: hidden;
}

/* ---- Ajustes mesa de Datos de Medición (robustos y forzados) ---- */
/* Colgroup define anchos 40%/40%/20% en el HTML; reafirmamos estilo aquí */
.measuring-table { table-layout: fixed !important; }

/* Evita overflow causado por padding/border: usamos calc */
.measuring-table input {
  display: block !important;
  margin: 6px auto !important;
  width: calc(100% - 12px) !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
}

/* Fecha y Hora: un poco más altas para mostrar fechas en dos líneas sin cortar.
   Altura vertical aumentada pero sin hacer las cajas excesivamente grandes. */
.fecha-input,
.hora-input {
  width: calc(100% - 12px) !important;
  height: 48px !important;        /* aumentado desde 36px a 48px */
  line-height: 20px !important;   /* permite que el contenido interno se muestre en 2 líneas */
  padding: 8px 6px !important;    /* padding vertical para que el texto no quede pegado */
  font-size: 16px !important;
  -webkit-appearance: none !important;
  appearance: none !important;
  white-space: normal !important;  /* permitir wrap interno si el UA lo soporta */
  text-align: center !important;
}

/* Estación: visualmente más corta */
.estacion-input {
  width: 60% !important;    /* prueba 50%-70% según prefieras */
  min-width: 40px !important;
  height: 34px !important;
  padding: 4px 6px !important;
  box-sizing: border-box !important;
}

/* Ajustes internos iOS para los date/time */
input[type="date"]::-webkit-datetime-edit,
input[type="time"]::-webkit-datetime-edit {
  padding: 0 4px !important;
  line-height: 20px !important;   /* coincide con .fecha/.hora para que el texto no se corte */
  font: inherit !important;
  white-space: normal !important;
}

input[type="date"]::-webkit-datetime-edit-text,
input[type="date"]::-webkit-datetime-edit-label {
  font: inherit !important;
  line-height: 20px !important;
  white-space: normal !important;
}

/* Indicador calendario / clear (no desbordar) */
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-clear-button {
  height: 28px !important;
  width: 28px !important;
  margin-left: 6px !important;
  opacity: 0.95 !important;
}

/* Forzar padding/overflow en celdas de la tabla de medición */
.measuring-table th,
.measuring-table td {
  padding: 8px 8px !important;
  overflow: hidden !important;
}

#loginOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;z-index:9999;
}
#loginBox{
    background:white;border-radius:20px;padding:30px 25px;
    text-align:center;max-width:320px;width:90%;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
#loginBox h2{margin:0 0 8px 0;font-size:20px;}
#loginBox p{color:#666;font-size:14px;margin:0 0 20px 0;}
#btnGoogle{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;
    background:white;font-size:15px;font-weight:500;cursor:pointer;margin-top:0;
}
#btnGoogle img{width:20px;height:20px;}
#syncStatus{font-size:11px;color:#999;text-align:center;padding:5px 0;}
#userInfo{display:flex;align-items:center;gap:8px;font-size:13px;}
#userInfo img{width:28px;height:28px;border-radius:50%;}
#btnLogout{background:none;border:none;font-size:12px;color:#999;cursor:pointer;padding:0;margin:0;width:auto;margin-top:0;}
</style>
</head>

<body>

<div id="loginOverlay">
  <div id="loginBox">
    <h2>CalculadoraV</h2>
    <p>Inicia sesión para sincronizar tus datos.</p>
    <button id="btnGoogle" onclick="loginGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Continuar con Google
    </button>
  </div>
</div>

<header class="app-header">
    <div class="logo">CalculadoraV</div>
    <div id="userInfo" style="display:none">
        <img id="userPhoto" src="" alt="">
        <button id="btnLogout" onclick="logout()">Salir</button>
    </div>
    <button class="history-btn" onclick="window.location.href='historial.html'">
        <svg viewBox="0 0 24 24" fill="black">
            <path d="M13 3a9 9 0 1 0 8.95 10H20a7 7 0 1 1-2.05-4.95L16 10h6V4l-2.05 2.05A8.96 8.96 0 0 0 13 3zm-1 5h2v6h-6v-2h4z"/>
        </svg>
    </button>
</header>

<div id="syncStatus">Conectando...</div>

<div class="container">

<div class="card">
<h2>Datos de Medición</h2>

<table class="measuring-table">
  <colgroup>
    <col style="width:40%;">
    <col style="width:40%;">
    <col style="width:20%;">
  </colgroup>
  <tr>
    <th>Fecha</th>
    <th>Hora</th>
    <th>Estación</th>
  </tr>
  <tr>
    <td><input type="date" id="fecha" class="fecha-input"></td>
    <td><input type="time" id="hora" class="hora-input"></td>
    <td><input type="text" id="estacion" class="estacion-input"></td>
  </tr>
</table>

<br>

<table>
<tr>
<th>Repeat</th>
<th>Stopwatch (s)</th>
<th>Anemometer (ft)</th>
<th>Before Corr.</th>
<th>Corrected</th>
</tr>

<tr>
<td>1</td>
<td><input type="number" id="sw1" readonly placeholder="tap"></td>
<td><input type="number" id="an1"></td>
<td id="bc1"></td>
<td id="c1"></td>
</tr>

<tr>
<td>2</td>
<td><input type="number" id="sw2" readonly placeholder="tap"></td>
<td><input type="number" id="an2"></td>
<td id="bc2"></td>
<td id="c2"></td>
</tr>

<tr>
<td>3</td>
<td><input type="number" id="sw3" readonly placeholder="tap"></td>
<td><input type="number" id="an3"></td>
<td id="bc3"></td>
<td id="c3"></td>
</tr>

</table>
</div>

<div class="card">
<h2>Resultados</h2>

<table>
<tr>
<th>Vprom (fpm)</th>
<th>σ</th>
<th>CV (%)</th>
</tr>
<tr>
<td id="vprom"></td>
<td id="sigma"></td>
<td id="cv"></td>
</tr>
</table>

<br>

<table>
<tr>
<th>Largo (m)</th>
<th>Altura (m)</th>
<th>Área (m²)</th>
<th>Q (cfm)</th>
</tr>
<tr>
<td><input type="number" id="largo"></td>
<td><input type="number" id="altura"></td>
<td id="area"></td>
<td id="q"></td>
</tr>
</table>

<button onclick="guardarRegistro()">Guardar</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDoc, enableIndexedDbPersistence }
    from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFwMlGgKcJGOcFAHlGXC-lR-zMpSJpLiM",
    authDomain: "calcv-5990e.firebaseapp.com",
    projectId: "calcv-5990e",
    storageBucket: "calcv-5990e.firebasestorage.app",
    messagingSenderId: "986351043016",
    appId: "1:986351043016:web:79386c3a1205fc1ef880fd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});

const provider = new GoogleAuthProvider();
let currentUser = null;

window.loginGoogle = async function(){
    try { await signInWithPopup(auth, provider); }
    catch(e){ alert("Error: " + e.message); }
};

window.logout = async function(){ await signOut(auth); };

onAuthStateChanged(auth, user => {
    if(user){
        currentUser = user;
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        document.getElementById('userPhoto').src = user.photoURL || '';
        document.getElementById('syncStatus').textContent = '✅ ' + user.email;
    } else {
        currentUser = null;
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('syncStatus').textContent = 'Sin sesión';
    }
});
    
const tablaCorreccion = [
  {min:30,max:50,corr:14},{min:50,max:70,corr:15},{min:70,max:90,corr:15},
  {min:90,max:100,corr:15},{min:100,max:200,corr:15},{min:200,max:300,corr:15},
  {min:300,max:400,corr:10},{min:400,max:500,corr:0},{min:500,max:600,corr:-5},
  {min:600,max:700,corr:-10},{min:700,max:800,corr:-15},{min:800,max:900,corr:-20},
  {min:900,max:1000,corr:-25},{min:1000,max:1200,corr:-30},{min:1200,max:1400,corr:-35},
  {min:1400,max:1600,corr:-45},{min:1600,max:1800,corr:-55},{min:1800,max:2000,corr:-60},
  {min:2000,max:2200,corr:-65},{min:2200,max:2400,corr:-75},{min:2400,max:2600,corr:-90},
  {min:2600,max:2800,corr:-100},{min:2800,max:3000,corr:-110},{min:3000,max:3200,corr:-120},
  {min:3200,max:3400,corr:-135},{min:3400,max:3600,corr:-150},{min:3600,max:3800,corr:-165},
  {min:3800,max:4000,corr:-175},{min:4000,max:4200,corr:-180},{min:4200,max:4400,corr:-190},
  {min:4400,max:4600,corr:-195},{min:4600,max:4800,corr:-200},{min:4800,max:5000,corr:-225}
];

function obtenerCorreccion(valor){
  for(let r of tablaCorreccion){
    if(valor>=r.min && valor<r.max){return r.corr;}
  }
  return 0;
}

window.calcular = function(){
  let corregidos=[];
  for(let i=1;i<=3;i++){
    let sw=parseFloat(document.getElementById("sw"+i).value);
    let an=parseFloat(document.getElementById("an"+i).value);
    if(!isNaN(sw)&&!isNaN(an)&&sw!==0){
      let before=(an/sw)*60;
      document.getElementById("bc"+i).textContent=before.toFixed(2);
      let corregido=before+obtenerCorreccion(before);
      document.getElementById("c"+i).textContent=corregido.toFixed(2);
      corregidos.push(corregido);
    }else{
      document.getElementById("bc"+i).textContent="";
      document.getElementById("c"+i).textContent="";
    }
  }

  if(corregidos.length>0){
    let promedio=corregidos.reduce((a,b)=>a+b,0)/corregidos.length;
    let suma=corregidos.map(v=>Math.pow(v-promedio,2)).reduce((a,b)=>a+b,0);
    let sigma=Math.sqrt(suma/corregidos.length);
    let cv=promedio!==0?(sigma/promedio)*100:0;

    document.getElementById("vprom").textContent=promedio.toFixed(2);
    document.getElementById("sigma").textContent=sigma.toFixed(2);
    document.getElementById("cv").textContent=cv.toFixed(2);

    let largo=parseFloat(document.getElementById("largo").value);
    let altura=parseFloat(document.getElementById("altura").value);

    if(!isNaN(largo)&&!isNaN(altura)){
      let area=largo*altura*0.95;
      document.getElementById("area").textContent=area.toFixed(3);
      let q=(area*promedio)/0.09290304;
      document.getElementById("q").textContent=q.toFixed(2);
    }
  }else{
    document.getElementById("vprom").textContent="";
    document.getElementById("sigma").textContent="";
    document.getElementById("cv").textContent="";
    document.getElementById("area").textContent="";
    document.getElementById("q").textContent="";
  }
}

document.querySelectorAll("input").forEach(el=>{
  el.addEventListener("input",calcular);
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}

window.guardarRegistro = async function(){
    if(!currentUser){ alert("Debes iniciar sesión primero."); return; }
    if(!vprom.textContent){ alert("Primero debes calcular los datos."); return; }

    let nombreEstacion = estacion.value.trim() || "Sin estación";

    let nuevo = {
        nombre: nombreEstacion,
        timestamp: Date.now(),
        datos:{
            fecha: fecha.value, hora: hora.value, estacion: estacion.value,
            sw1: sw1.value, sw2: sw2.value, sw3: sw3.value,
            an1: an1.value, an2: an2.value, an3: an3.value,
            bc1: bc1.textContent, bc2: bc2.textContent, bc3: bc3.textContent,
            c1: c1.textContent, c2: c2.textContent, c3: c3.textContent,
            vprom: vprom.textContent, sigma: sigma.textContent, cv: cv.textContent,
            largo: largo.value, altura: altura.value, area: area.textContent, q: q.textContent
        }
    };

    try {
        document.getElementById('syncStatus').textContent = '💾 Guardando...';
        await addDoc(collection(db, "usuarios", currentUser.uid, "registros"), nuevo);
        document.getElementById('syncStatus').textContent = '✅ Guardado y sincronizado';
        alert("Guardado correctamente ✅");
    } catch(e) {
        document.getElementById('syncStatus').textContent = '⚠️ Sin conexión — guardado local';
        alert("Guardado localmente. Se sincronizará cuando haya internet. ✅");
    }

    document.querySelectorAll('input').forEach(el => el.value = '');
    ['bc1','bc2','bc3','c1','c2','c3','vprom','sigma','cv','area','q']
        .forEach(id => document.getElementById(id).textContent = '');
    const hoy = new Date();
    document.getElementById('fecha').value = hoy.getFullYear() + '-' +
        String(hoy.getMonth()+1).padStart(2,'0') + '-' + String(hoy.getDate()).padStart(2,'0');
    document.getElementById('hora').value = hoy.toTimeString().slice(0,5);
}

// === MODO VISTA ===

function obtenerParametro(nombre){
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(nombre);
}

let viewId = obtenerParametro("view");
if(viewId !== null){
    onAuthStateChanged(auth, async user => {
        if(!user) return;
        let snap = await getDoc(doc(db, "usuarios", user.uid, "registros", viewId));
        if(snap.exists()){
            let registro = snap.data();
            let d = registro.datos;
            document.querySelector(".logo").textContent = registro.nombre + " (Modo Vista)";
            document.querySelector(".logo").classList.add("slide-in");
            fecha.value=d.fecha; hora.value=d.hora; estacion.value=d.estacion;
            sw1.value=d.sw1; sw2.value=d.sw2; sw3.value=d.sw3;
            an1.value=d.an1; an2.value=d.an2; an3.value=d.an3;
            bc1.textContent=d.bc1; bc2.textContent=d.bc2; bc3.textContent=d.bc3;
            c1.textContent=d.c1; c2.textContent=d.c2; c3.textContent=d.c3;
            vprom.textContent=d.vprom; sigma.textContent=d.sigma; cv.textContent=d.cv;
            largo.value=d.largo; altura.value=d.altura; area.textContent=d.area; q.textContent=d.q;
            document.querySelectorAll("input").forEach(el=>{
                el.disabled=true; el.style.background="#f3f3f3"; el.style.cursor="default";
            });
            let btnGuardar = document.querySelector("button[onclick='guardarRegistro()']");
            if(btnGuardar) btnGuardar.style.display="none";
            document.querySelectorAll(".card").forEach(card=>card.classList.add("fade-in"));
            let volver = document.createElement("button");
            volver.textContent = "Volver al Historial";
            volver.style.marginTop = "15px";
            volver.classList.add("fade-in");
            volver.onclick = ()=> window.location.href="historial.html";
            document.querySelector(".card:last-child").appendChild(volver);
        }
    });
}

// Busca esto en tu script y asegúralo así:
document.querySelectorAll("input[type='number']").forEach(el => {
    el.setAttribute("inputmode", "decimal");
    el.setAttribute("pattern", "[0-9]*");
    el.setAttribute("step", "any"); // Muy importante para cálculos técnicos
});

// Fecha y hora automáticas
(function(){
  const hoy = new Date();
  const fecha = hoy.getFullYear() + '-' + 
      String(hoy.getMonth()+1).padStart(2,'0') + '-' + 
      String(hoy.getDate()).padStart(2,'0');
  const hora = hoy.toTimeString().slice(0,5);
  document.getElementById('fecha').value = fecha;
  document.getElementById('hora').value = hora;
})();

// Cronómetro por casilla
(function(){
  [1,2,3].forEach(i => {
    let el = document.getElementById('sw'+i);
    let running = false;
    let startTime = null;
    let interval = null;
    let lastClick = 0;

    el.addEventListener('touchend', function(e){
      e.preventDefault();
      let now = Date.now();
      let gap = now - lastClick;
      lastClick = now;

      // Doble click = modo manual
      if(gap < 500){
        clearInterval(interval);
        running = false;
        el.removeAttribute('readonly');
        el.value = '';
        el.focus();
        return;
      }

      if(!running){
        // Iniciar
        el.setAttribute('readonly', true);
        startTime = Date.now();
        running = true;
        interval = setInterval(()=>{
          let seg = (Date.now() - startTime) / 1000;
          el.value = seg.toFixed(2);
          calcular();
        }, 50);
      } else {
        // Parar
        clearInterval(interval);
        running = false;
        let seg = (Date.now() - startTime) / 1000;
        el.value = seg.toFixed(2);
        calcular();
      }
    });
  });
})();
    
</script>

</body>

</html>
