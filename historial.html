<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background:#e9ecef;
}

.app-header{
    padding:15px 20px;
    background:white;
    position:sticky;
    top:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
}

.container{
    max-width:460px;
    margin:20px auto;
    padding:0 15px 30px 15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.boton-registro{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    margin-bottom:10px;
    background:#1a73e8;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.opciones{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.opciones button{
    background:none;
    border:none;
    font-size:13px;
    cursor:pointer;
    color:#666;
}

.volver{
    margin-top:20px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:14px;
    background:#333;
    color:white;
    cursor:pointer;
}

.vacio{
    text-align:center;
    color:#777;
    padding:20px 0;
}

input{
    width:100%;
    height:32px;
    padding:0 6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:13px;
    text-align:center;
    background:white;
    -webkit-appearance:none;
    appearance:none;
}

td {
    overflow: hidden;
}


</style>
</head>

<body>

<header class="app-header">
  Historial
  <button onclick="window.location.href='index.html'">Inicio</button>
  <button onclick="exportarTodo()">📦 Exportar todo</button>
</header>

<div class="container">
<div class="card" id="contenido"></div>
</div>

<script>

function obtenerRegistros(){
    return JSON.parse(localStorage.getItem("registrosApp")) || [];
}

function guardarRegistros(data){
    localStorage.setItem("registrosApp", JSON.stringify(data));
}

function copiar(texto){
    navigator.clipboard.writeText(texto).then(()=>{
        alert("Copiado al portapapeles ✅");
    }).catch(()=>{
        alert("No se pudo copiar automáticamente.");
    });
}

/* ========= EXPORTAR SIMPLE (sin encabezados) ========= */
function exportarSimple(index){
    let registros = obtenerRegistros();
    let r = registros[index].datos;

    let fila = [
        r.fecha,
        r.hora,
        r.estacion,

        r.sw1, r.an1, r.bc1, r.c1,
        r.sw2, r.an2, r.bc2, r.c2,
        r.sw3, r.an3, r.bc3, r.c3,

        r.vprom,
        r.sigma,
        r.cv,

        r.largo,
        r.altura,
        r.area,
        r.q
    ].join("\t");

    copiar(fila);
}

/* ========= EXPORTAR CON DETALLES (con encabezados) ========= */
function exportarConDetalles(index){
    let registros = obtenerRegistros();
    let r = registros[index].datos;

    let encabezados = [
        "Fecha",
        "Hora",
        "Estación",

        "SW1","AN1","Before1","Corr1",
        "SW2","AN2","Before2","Corr2",
        "SW3","AN3","Before3","Corr3",

        "Vprom",
        "Sigma",
        "CV",

        "Largo",
        "Altura",
        "Área",
        "Q"
    ].join("\t");

    let fila = [
        r.fecha,
        r.hora,
        r.estacion,

        r.sw1, r.an1, r.bc1, r.c1,
        r.sw2, r.an2, r.bc2, r.c2,
        r.sw3, r.an3, r.bc3, r.c3,

        r.vprom,
        r.sigma,
        r.cv,

        r.largo,
        r.altura,
        r.area,
        r.q
    ].join("\t");

    copiar(encabezados + "\n" + fila);
}

function exportarTodo(){
  let registros = obtenerRegistros();
  if(registros.length === 0){ alert('No hay registros.'); return; }
  let encabezados = ["Nombre","Fecha","Hora","Estación","SW1","AN1","Before1","Corr1","SW2","AN2","Before2","Corr2","SW3","AN3","Before3","Corr3","Vprom","Sigma","CV","Largo","Altura","Área","Q"].join("\t");
  let filas = registros.map(reg => {
    let r = reg.datos;
    return [reg.nombre, r.fecha, r.hora, r.estacion, r.sw1, r.an1, r.bc1, r.c1, r.sw2, r.an2, r.bc2, r.c2, r.sw3, r.an3, r.bc3, r.c3, r.vprom, r.sigma, r.cv, r.largo, r.altura, r.area, r.q].join("\t");
  });
  copiar(encabezados + "\n" + filas.join("\n"));
}

/* ========= LISTA ========= */

function renderLista(){

    let contenedor = document.getElementById("contenido");
    let registros = obtenerRegistros();

    if(registros.length === 0){
        contenedor.innerHTML = '<div class="vacio">Aquí aparecerán los registros guardados.</div>';
        return;
    }

    contenedor.innerHTML = "";

    registros.forEach((reg,index)=>{
        contenedor.innerHTML += `
            <button class="boton-registro" onclick="window.location.href='index.html?view=${index}'">
                ${reg.nombre}
            </button>

            <div class="opciones">
                <button onclick="renombrar(${index})">✏ Renombrar</button>
                <button onclick="eliminar(${index})">🗑 Eliminar</button>
                <button onclick="exportarSimple(${index})">📋 Exportar</button>
                <button onclick="exportarConDetalles(${index})">📄 Exportar con detalles</button>
            </div>
        `;
    });
}

function eliminar(index){
  if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
  let registros = obtenerRegistros();
  registros.splice(index,1);
  guardarRegistros(registros);
  renderLista();
}

function renombrar(index){
    let registros = obtenerRegistros();
    let nuevo = prompt("Nuevo nombre:");
    if(nuevo){
        registros[index].nombre = nuevo;
        guardarRegistros(registros);
        renderLista();
    }
}

renderLista();

</script>

</body>

</html>
