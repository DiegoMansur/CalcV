<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial</title>

<style>
*{box-sizing:border-box;}


body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background:#e9ecef;
}

.app-header{
    padding:15px 20px;
    background:white;
    position:sticky;
    top:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
}

.container{
    max-width:460px;
    margin:20px auto;
    padding:0 15px 30px 15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.boton-registro{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    margin-bottom:10px;
    background:#1a73e8;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.opciones{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.opciones button{
    background:none;
    border:none;
    font-size:13px;
    cursor:pointer;
    color:#666;
}

.volver{
    margin-top:20px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:14px;
    background:#333;
    color:white;
    cursor:pointer;
}

.vacio{
    text-align:center;
    color:#777;
    padding:20px 0;
}

input{
    width:100%;
    height:32px;
    padding:0 6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:13px;
    text-align:center;
    background:white;
    -webkit-appearance:none;
    appearance:none;
}

td {
    overflow: hidden;
}

#loginOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;z-index:9999;
}
#loginBox{
    background:white;border-radius:20px;padding:30px 25px;
    text-align:center;max-width:320px;width:90%;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
#loginBox h2{margin:0 0 8px 0;font-size:20px;}
#loginBox p{color:#666;font-size:14px;margin:0 0 20px 0;}
#btnGoogle{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;
    background:white;font-size:15px;font-weight:500;cursor:pointer;margin-top:0;color:#333;
}
#btnGoogle img{width:20px;height:20px;}
#syncStatus{font-size:11px;color:#999;text-align:center;padding:5px 0;}
#userInfo{display:flex;align-items:center;gap:8px;font-size:13px;}
#userInfo img{width:28px;height:28px;border-radius:50%;}
#btnLogout{background:none;border:none;font-size:12px;color:#999;cursor:pointer;padding:0;margin:0;width:auto;margin-top:0;}
    
</style>


</head>

<body>

<div id="loginOverlay" style="display:none">
  <div id="loginBox">
    <h2>CalculadoraV</h2>
    <p>Inicia sesión para ver tu historial.</p>
    <button id="btnGoogle" onclick="loginGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Continuar con Google
    </button>
  </div>
</div>
    
<header class="app-header">
  Historial
  <div id="userInfo" style="display:none">
      <img id="userPhoto" src="" alt="">
      <button id="btnLogout" onclick="logout()">Salir</button>
  </div>
  <button onclick="window.location.href='index.html'">Inicio</button>
  <button onclick="exportarTodo()">📦 Exportar todo</button>
</header>

<div id="syncStatus">Conectando...</div>

<div class="container">
    <div class="card" id="contenido"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, deleteDoc, updateDoc, query, orderBy, enableIndexedDbPersistence }
    from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFwMlGgKcJGOcFAHlGXC-lR-zMpSJpLiM",
    authDomain: "calcv-5990e.firebaseapp.com",
    projectId: "calcv-5990e",
    storageBucket: "calcv-5990e.firebasestorage.app",
    messagingSenderId: "986351043016",
    appId: "1:986351043016:web:79386c3a1205fc1ef880fd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});

const provider = new GoogleAuthProvider();
let currentUser = null;
let registrosCache = [];

provider.setCustomParameters({prompt: 'select_account'});
    
window.loginGoogle = async function(){
    try {
        await signInWithPopup(auth, provider);
    } catch(e) {
        if(e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request'){
            await signInWithRedirect(auth, provider);
        } else {
            alert("Error: " + e.message);
        }
    }
};

window.logout = async function(){
    if(!confirm('¿Cerrar sesión?')) return;
    await signOut(auth);
};

onAuthStateChanged(auth, async user => {
    if(user){
        currentUser = user;
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        document.getElementById('userPhoto').src = user.photoURL || '';
        document.getElementById('syncStatus').textContent = '✅ ' + user.email;
        await cargarRegistros();
    } else {
        currentUser = null;
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('syncStatus').textContent = 'Sin sesión';
        document.getElementById('contenido') && (document.getElementById('contenido').innerHTML = '<div class="vacio">Inicia sesión para ver tus registros.</div>');
    }
});

async function cargarRegistros(){
    try {
        let q = query(collection(db, "usuarios", currentUser.uid, "registros"), orderBy("timestamp","asc"));
        let snap = await getDocs(q);
        registrosCache = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderLista();
    } catch(e){
        document.getElementById('syncStatus').textContent = '⚠️ Sin conexión — datos locales';
        // Intentar con caché local
        try {
            const { getDocsFromCache } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
            let q = query(collection(db, "usuarios", currentUser.uid, "registros"), orderBy("timestamp","asc"));
            let snap = await getDocsFromCache(q);
            registrosCache = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderLista();
        } catch(e2){
            document.getElementById('contenido').innerHTML = '<div class="vacio">Sin datos locales aún. Conéctate una vez primero.</div>';
        }
    }
}

function copiar(texto){
    navigator.clipboard.writeText(texto).then(()=>{
        alert("Copiado al portapapeles ✅");
    }).catch(()=>{
        alert("No se pudo copiar automáticamente.");
    });
}

async function _descargar(wb, nombre){
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function _estiloCelda(cell, bold){
    cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    cell.border = {
        top:{style:'thin',color:{argb:'FF000000'}},
        left:{style:'thin',color:{argb:'FF000000'}},
        bottom:{style:'thin',color:{argb:'FF000000'}},
        right:{style:'thin',color:{argb:'FF000000'}}
    };
    if(bold) cell.font = {bold:true};
}

async function _crearLibro(registros, conEncabezados){
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Datos');

    if(conEncabezados){
        // Fila 1: Velocity (fpm) sobre H e I
        const fila1 = ws.getRow(1);
        fila1.height = 20;
        let vCell = ws.getCell('H1');
        vCell.value = 'Velocity (fpm)';
        _estiloCelda(vCell, true);
        ws.mergeCells('H1:I1');

        // Merge encabezados fila 1+2 para columnas que no tienen Velocity
        ['A','B','C','D','E','F','J','K','L','M','N','O','P'].forEach(col => {
            ws.mergeCells(`${col}1:${col}2`);
        });

        // Fila 2: encabezados
        const fila2 = ws.getRow(2);
        fila2.height = 30;
        const headers = {
            A:'Date', B:'Time', C:'Station', D:'Repeat',
            E:'Stopwatch Reading (s)', F:'Anemometer Reading (feet)',
            H:'Before Correction', I:'Corrected',
            J:'Vprom (fpm)', K:'σ', L:'CV',
            M:'Large (m)', N:'Height (m)', O:'Area (m2)', P:'Q (cfm)'
        };
        Object.entries(headers).forEach(([col, val]) => {
            let cell = ws.getCell(`${col}2`);
            cell.value = val;
            _estiloCelda(cell, true);
        });

        // Aplicar borde también a celdas mergeadas de fila 1
        ['A','B','C','D','E','F','J','K','L','M','N','O','P'].forEach(col => {
            _estiloCelda(ws.getCell(`${col}1`), true);
        });
    }

    // Anchos de columna
    ws.columns = [
        {key:'A', width:12}, {key:'B', width:8}, {key:'C', width:10}, {key:'D', width:7},
        {key:'E', width:16}, {key:'F', width:18},
        {key:'G', width:2}, // separador vacío
        {key:'H', width:16}, {key:'I', width:12},
        {key:'J', width:11}, {key:'K', width:8}, {key:'L', width:8},
        {key:'M', width:9}, {key:'N', width:10}, {key:'O', width:10}, {key:'P', width:13}
    ];

    let filaActual = conEncabezados ? 3 : 1;

    registros.forEach(reg => {
        const r = reg.datos;
        const f = filaActual;

        // 3 filas de datos
        const datos = [
            {rep:1, sw:r.sw1, an:r.an1, bc:r.bc1, c:r.c1},
            {rep:2, sw:r.sw2, an:r.an2, bc:r.bc2, c:r.c2},
            {rep:3, sw:r.sw3, an:r.an3, bc:r.bc3, c:r.c3},
        ];

        datos.forEach((d, i) => {
            const fila = ws.getRow(f+i);
            fila.height = 22;

            // Repeat, SW, AN, BC, C siempre
            let repCell = ws.getCell(`D${f+i}`);
            repCell.value = d.rep;
            _estiloCelda(repCell, false);

            let swCell = ws.getCell(`E${f+i}`);
            swCell.value = parseFloat(d.sw)||0;
            _estiloCelda(swCell, false);

            let anCell = ws.getCell(`F${f+i}`);
            anCell.value = parseFloat(d.an)||0;
            _estiloCelda(anCell, false);

            let bcCell = ws.getCell(`H${f+i}`);
            bcCell.value = parseFloat(d.bc)||0;
            _estiloCelda(bcCell, false);

            let cCell = ws.getCell(`I${f+i}`);
            cCell.value = parseFloat(d.c)||0;
            _estiloCelda(cCell, false);
        });

        // Celdas combinadas (3 filas): Date, Time, Station, Vprom, σ, CV, Large, Height, Area, Q
        ws.mergeCells(`A${f}:A${f+2}`);
        ws.mergeCells(`B${f}:B${f+2}`);
        ws.mergeCells(`C${f}:C${f+2}`);
        ws.mergeCells(`J${f}:J${f+2}`);
        ws.mergeCells(`K${f}:K${f+2}`);
        ws.mergeCells(`L${f}:L${f+2}`);
        ws.mergeCells(`M${f}:M${f+2}`);
        ws.mergeCells(`N${f}:N${f+2}`);
        ws.mergeCells(`O${f}:O${f+2}`);
        ws.mergeCells(`P${f}:P${f+2}`);

        const vals = {
            A: r.fecha, B: r.hora, C: r.estacion,
            J: parseFloat(r.vprom)||0, K: parseFloat(r.sigma)||0, L: parseFloat(r.cv)||0,
            M: parseFloat(r.largo)||0, N: parseFloat(r.altura)||0,
            O: parseFloat(r.area)||0, P: parseFloat(r.q)||0
        };
        Object.entries(vals).forEach(([col, val]) => {
            let cell = ws.getCell(`${col}${f}`);
            cell.value = val;
            _estiloCelda(cell, false);
        });

        filaActual += 4;
    });

    return wb;
}

window.exportarSimple = async function(index){
    let nombre = registrosCache[index].nombre;
    let wb = await _crearLibro([registrosCache[index]], false);
    await _descargar(wb, nombre + '.xlsx');
}

window.exportarConDetalles = async function(index){
    let nombre = registrosCache[index].nombre;
    let wb = await _crearLibro([registrosCache[index]], true);
    await _descargar(wb, nombre + '_detalles.xlsx');
}

window.exportarTodo = async function(){
    if(registrosCache.length === 0){ alert('No hay registros.'); return; }
    let wb = await _crearLibro(registrosCache, true);
    await _descargar(wb, 'registros_completos.xlsx');
}

function renderLista(){
    let contenedor = document.getElementById("contenido");
    if(registrosCache.length === 0){
        contenedor.innerHTML = '<div class="vacio">Aquí aparecerán los registros guardados.</div>';
        return;
    }
    contenedor.innerHTML = "";
    registrosCache.forEach((reg, index) => {
        contenedor.innerHTML += `
            <button class="boton-registro" onclick="window.location.href='index.html?view=${reg.id}'">
                ${reg.nombre}
            </button>
            <div class="opciones">
                <button onclick="renombrar('${reg.id}',${index})">✏ Renombrar</button>
                <button onclick="eliminar('${reg.id}')">🗑 Eliminar</button>
                <button onclick="exportarSimple(${index})">📋 Exportar</button>
                <button onclick="exportarConDetalles(${index})">📄 Exportar con detalles</button>
            </div>
        `;
    });
}

window.eliminar = async function(docId){
    if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
    try {
        await deleteDoc(doc(db, "usuarios", currentUser.uid, "registros", docId));
        registrosCache = registrosCache.filter(r => r.id !== docId);
        renderLista();
    } catch(e){ alert("Error al eliminar: " + e.message); }
}

window.renombrar = async function(docId, index){
    let nuevo = prompt("Nuevo nombre:");
    if(!nuevo) return;
    try {
        await updateDoc(doc(db, "usuarios", currentUser.uid, "registros", docId), {nombre: nuevo});
        registrosCache[index].nombre = nuevo;
        renderLista();
    } catch(e){ alert("Error al renombrar: " + e.message); }
}
    
</script>

</body>

</html>
